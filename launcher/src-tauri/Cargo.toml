[package]
name = "springrp-launcher"
version = "0.1.3"
description = "Windows desktop shell for SpringRP"
authors = ["SpringRP contributors"]
edition = "2021"

[lib]
name = "plasmo_launcher"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tauri = { version = "2", features = ["image-png"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "time"] }
tauri-plugin-opener = "2.5.4"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
] }
