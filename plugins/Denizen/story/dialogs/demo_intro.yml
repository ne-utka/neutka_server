id: demo_intro
start: greeting

nodes:
  greeting:
    lines:
      - speaker: Спикер
        audio: 05_dictaphone_prompt
        text: "Теперь подойди к диктофону и послушай что скажет эта алкашка."
    choices:
      listen_more:
        text: "Послушать дальше"
        next: reaction
      leave:
        text: "Закончить разговор"
        next: goodbye

  reaction:
    lines:
      - speaker: Спикер
        audio: 06_dictaphone_done_1
        text: "ЭТА ЧО ЗА НАХУ?!"
      - pause: 6t
      - speaker: Спикер
        audio: 07_dictaphone_done_2
        text: "Чувака, это жоско."
    next: end

  goodbye:
    lines:
      - speaker: Спикер
        text: "Ладно. Возвращайся, если передумаешь."
        duration: 35t
    next: end
