id: merchant_dialog
start: main

nodes:
  main:
    lines:
      - speaker: Торговец
        text: "Какова, в конце концов, наша цель? Мы бродим здесь уже..."
        duration: 65t
    choices:
      goal:
        text: "О цели"
        next: goal
      denofine:
        text: "О Денофайне"
        next: denofine
      egg:
        text: "О яйце"
        next: egg
      deadlines:
        text: "О сроках"
        next: deadlines
      leave:
        text: "Уйти"
        next: leave

  goal:
    lines:
      - speaker: Торговец
        text: "Цель? Она изменилась с тех пор, как замолчал Денофайн."
        duration: 65t
      - speaker: Торговец
        text: "Теперь всё зависит от того, что в себе таит оно..."
        duration: 65t
    choices:
      what_is_denofine:
        text: "Что такое Денофайн?"
        next: what_is_denofine
      what_are_you_saying:
        text: "О чём ты говоришь?"
        next: what_are_you_saying
      when_will_it_fly:
        text: "Когда велёт?"
        next: when_will_it_fly
      back:
        text: "Вернуться"
        next: main

  what_is_denofine:
    lines:
      - speaker: Торговец
        text: "Денофайн... (пауза) Он не отвечает. Не отвечает уже слишком долго."
        duration: 80t
      - speaker: Торговец
        text: "А без него мы слепы. Слепы перед Теми, Кто Наблюдают."
        duration: 70t
    choices:
      who_are_op:
        text: "Кто такие ОП?"
        next: who_are_op
      what_about_egg:
        text: "Что с яйцом?"
        next: what_about_egg
      back:
        text: "Вернуться"
        next: main

  who_are_op:
    lines:
      - speaker: Торговец
        text: "Хранители Порядка. Те, кто следит за балансом."
        duration: 60t
      - speaker: Торговец
        text: "Но они спорят. Спорят о том, что делать с тем, что мы нашли."
        duration: 70t
    choices:
      what_found:
        text: "Что мы нашли?"
        next: what_found
      back:
        text: "Вернуться"
        next: main

  what_found:
    lines:
      - speaker: Торговец
        text: "Яйцо. Но не простое. В нём... память. Память миров."
        duration: 70t
      - speaker: Торговец
        text: "И если оно проснётся не в тот момент..."
        duration: 65t
    next: main

  what_about_egg:
    lines:
      - speaker: Торговец
        text: "Оно спит. Непробудным сном."
        duration: 50t
      - speaker: Торговец
        text: "Но сон этот — последний договор. Договор, который мы не можем нарушить."
        duration: 80t
    next: main

  what_are_you_saying:
    lines:
      - speaker: Торговец
        text: "О том, что мы ищем. О том, что скрывается."
        duration: 55t
      - speaker: Торговец
        text: "Денофайн знал. Но теперь он молчит. И мы должны действовать вслепую."
        duration: 80t
    next: main

  when_will_it_fly:
    lines:
      - speaker: Торговец
        text: "Велёт тогда, когда мы поймём, что скрывает яйцо."
        duration: 65t
      - speaker: Торговец
        text: "Или когда ОП решат, что пора. А они решают медленно."
        duration: 70t
    next: main

  denofine:
    lines:
      - speaker: Торговец
        text: "Денофайн исчез. Или замолчал. Разница невелика."
        duration: 65t
      - speaker: Торговец
        text: "Он был нашим проводником. Нашим знанием. Теперь мы одни."
        duration: 70t
    choices:
      why_silent:
        text: "Почему он замолчал?"
        next: why_silent
      what_it_means:
        text: "Что это значит?"
        next: what_it_means
      back:
        text: "Вернуться"
        next: main

  why_silent:
    lines:
      - speaker: Торговец
        text: "Может, увидел то, что не должен был. Может, его заставили."
        duration: 70t
      - speaker: Торговец
        text: "Или... может, он сам выбрал молчание. Чтобы не выдать тайну."
        duration: 75t
    next: main

  what_it_means:
    lines:
      - speaker: Торговец
        text: "Это значит, что цель изменилась. Мы больше не ищем — мы спасаем."
        duration: 75t
      - speaker: Торговец
        text: "Спасаем то, что ещё можно спасти. Пока не поздно."
        duration: 65t
    next: main

  egg:
    lines:
      - speaker: Торговец
        text: "Яйцо дракона. Но не то, о котором ты думаешь."
        duration: 65t
      - speaker: Торговец
        text: "В нём не просто сила. В нём — память. Память всех миров, что были до нас."
        duration: 85t
    choices:
      what_to_do:
        text: "Что с ним делать?"
        next: what_to_do
      why_important:
        text: "Почему оно важно?"
        next: why_important
      back:
        text: "Вернуться"
        next: main

  what_to_do:
    lines:
      - speaker: Торговец
        text: "Ждать. Ждать, пока ОП решат. Или пока Денофайн вернётся."
        duration: 75t
      - speaker: Торговец
        text: "Но время идёт. И сон яйца становится всё глубже."
        duration: 65t
    next: main

  why_important:
    lines:
      - speaker: Торговец
        text: "Оно — последний договор. Договор между мирами."
        duration: 60t
      - speaker: Торговец
        text: "Если оно проснётся не в тот момент... всё рухнет. Всё, что мы знаем."
        duration: 80t
    next: main

  deadlines:
    lines:
      - speaker: Торговец
        text: "Когда велёт? (тихий смешок) Вопрос не в том, когда. Вопрос в том, успеем ли мы."
        duration: 90t
      - speaker: Торговец
        text: "Денофайн молчит. Яйцо спит. ОП спорят. А время... время уходит."
        duration: 80t
    choices:
      what_if_late:
        text: "Что будет, если опоздаем?"
        next: what_if_late
      back:
        text: "Вернуться"
        next: main

  what_if_late:
    lines:
      - speaker: Торговец
        text: "Тогда яйцо проснётся само. И проснётся не в тот момент."
        duration: 70t
      - speaker: Торговец
        text: "И последний договор будет нарушен. А за нарушением... (пауза) ничего не останется."
        duration: 90t
    next: main

  leave:
    lines:
      - speaker: Торговец
        text: "(Скрип двери вдалеке)"
        duration: 45t
      - speaker: Торговец
        text: "Всё только начинается. Помни это."
        duration: 60t
    next: end
