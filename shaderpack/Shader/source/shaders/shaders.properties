# neutka - Iris/Sodium shader pack
oldLighting=true
iris.features.required=ENTITY_TRANSLUCENT
separateEntityDraws=true

colortex1Format=RGBA8
clearColortex1=true
# Match CazToon's permissive outline/skylight default. Geometry passes that
# need exclusion explicitly overwrite this metadata.
colortex1ClearColor=1.0 0.0 1.0 0.0
colortex2Format=RGBA8
clearColortex2=true
colortex2ClearColor=0.0 0.0 0.0 0.0
colortex4Format=RGBA16F
clearColortex4=false

program.composite1.enabled=TAA_ENABLED

# The mask must be replaced rather than alpha-blended in translucent passes.
blend.gbuffers_water.colortex1=off
blend.gbuffers_entities_translucent.colortex1=off
blend.gbuffers_block_translucent.colortex1=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_block_translucent.colortex2=off
blend.gbuffers_entities_translucent.colortex2=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_weather.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_beaconbeam.colortex1=off
blend.gbuffers_beaconbeam.colortex2=off

screen=TAA_ENABLED TAA_BLEND TAA_JITTER_STRENGTH <empty> OUTLINE_MODE OUTLINE_BRIGHTNESS OUTLINE_SATURATION OUTLINE_PIXEL_SIZE VOXY_LOD_OUTLINES VOXY_FACE_FLATTEN_ENABLED VOXY_FACE_FLATTEN_START <empty> WATER_LOD_SMOOTHING_ENABLED WATER_BLUR_START WATER_BLUR_END WATER_BLUR_STRENGTH <empty> MAGICAL_TOUCH OUTLINE_FOG_START OUTLINE_FOG_STRENGTH EMISSIVE_BRIGHTNESS ENTITY_EMISSIVE_BRIGHTNESS
sliders=TAA_BLEND TAA_JITTER_STRENGTH VOXY_FACE_FLATTEN_START WATER_BLUR_START WATER_BLUR_END WATER_BLUR_STRENGTH OUTLINE_BRIGHTNESS OUTLINE_SATURATION OUTLINE_PIXEL_SIZE OUTLINE_FOG_START OUTLINE_FOG_STRENGTH EMISSIVE_BRIGHTNESS ENTITY_EMISSIVE_BRIGHTNESS
