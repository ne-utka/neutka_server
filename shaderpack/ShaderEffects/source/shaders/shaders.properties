# ShaderEffects - Iris/Sodium shader pack
oldLighting=true
iris.features.required=ENTITY_TRANSLUCENT
separateEntityDraws=true

colortex1Format=RGBA8
clearColortex1=true
colortex1ClearColor=0.0 0.0 0.0 0.0
colortex2Format=RGBA8
clearColortex2=true
colortex2ClearColor=0.0 0.0 0.0 0.0
colortex4Format=RGBA16F
clearColortex4=false
colortex5Format=RGBA16F
clearColortex5=true
colortex5ClearColor=0.0 0.0 0.0 0.0
colortex6Format=RGBA16F
clearColortex6=true
colortex6ClearColor=0.0 0.0 0.0 0.0

# Bloom is evaluated at half resolution to reduce bandwidth and blur cost.
size.buffer.colortex5=0.5 0.5
size.buffer.colortex6=0.5 0.5

program.composite1.enabled=TAA_ENABLED
program.composite2.enabled=BLOOM_ENABLED
program.composite3.enabled=BLOOM_ENABLED
program.composite4.enabled=BLOOM_ENABLED
program.composite5.enabled=BLOOM_ENABLED || COLOR_GRADING_ENABLED || VIGNETTE_ENABLED

# The mask must be replaced rather than alpha-blended in translucent passes.
blend.gbuffers_water.colortex1=off
blend.gbuffers_entities_translucent.colortex1=off
blend.gbuffers_block_translucent.colortex1=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_block_translucent.colortex2=off
blend.gbuffers_entities_translucent.colortex2=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_weather.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_beaconbeam.colortex1=off
blend.gbuffers_beaconbeam.colortex2=off

screen=[POST_EFFECTS] <empty> TAA_ENABLED TAA_BLEND TAA_JITTER_STRENGTH <empty> OUTLINE_MODE OUTLINE_BRIGHTNESS OUTLINE_SATURATION OUTLINE_PIXEL_SIZE VOXY_LOD_OUTLINES MAGICAL_TOUCH OUTLINE_FOG_START OUTLINE_FOG_STRENGTH EMISSIVE_BRIGHTNESS ENTITY_EMISSIVE_BRIGHTNESS
screen.POST_EFFECTS=BLOOM_ENABLED BLOOM_THRESHOLD BLOOM_STRENGTH BLOOM_RADIUS BLOOM_EMISSIVE_BOOST <empty> COLOR_GRADING_ENABLED POST_EXPOSURE POST_SATURATION <empty> VIGNETTE_ENABLED VIGNETTE_STRENGTH
sliders=TAA_BLEND TAA_JITTER_STRENGTH BLOOM_THRESHOLD BLOOM_STRENGTH BLOOM_RADIUS BLOOM_EMISSIVE_BOOST POST_EXPOSURE POST_SATURATION VIGNETTE_STRENGTH OUTLINE_BRIGHTNESS OUTLINE_SATURATION OUTLINE_PIXEL_SIZE OUTLINE_FOG_START OUTLINE_FOG_STRENGTH EMISSIVE_BRIGHTNESS ENTITY_EMISSIVE_BRIGHTNESS
